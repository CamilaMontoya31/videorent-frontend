<section class="search-page">
  <header class="hero">
    <p class="eyebrow">Catálogo</p>
    <h2>Búsqueda de películas</h2>
    <p>Filtra por título y género.</p>
  </header>
 <!-- aqui probar buscar_profe() para ver en consola si se esta buscando bien-->
  <form class="search-form" [formGroup]="searchForm" (ngSubmit)="buscar()">
    <label class="field">
      <span>Título</span>
      <input type="text" formControlName="titulo" placeholder="Ej. Women" />
    </label>

    <label class="field">
      <span>Género</span>
      <input type="text" formControlName="genero" placeholder="Ej. Drama" />
    </label>

    <div class="actions">
      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Buscando...' : 'Buscar' }}
      </button>
      <button type="button" class="secondary" (click)="limpiar()"> Limpiar 
      </button>

    </div>
  </form>

  if(error())
    <p class="error-message" role="alert">{{error()}}</p>
</section>
